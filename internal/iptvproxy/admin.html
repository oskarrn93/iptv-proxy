<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>iptv-proxy admin</title>
    <!-- Vendored locally (admin.go go:embeds static/htmx.js, static/json-enc.js) rather than a CDN, so this page needs no outbound internet access. -->
    <script src="/admin/static/htmx.js"></script>
    <script src="/admin/static/json-enc.js"></script>
    <link rel="stylesheet" href="/admin/static/admin.css" />
  </head>
  <body hx-ext="json-enc">
    <h1>iptv-proxy admin</h1>
    <p><a href="/admin/views">Manage views</a></p>

    <h2>Create a share link</h2>
    <div
      hx-get="/admin/feeds"
      hx-trigger="load"
      hx-target="#feed"
      hx-swap="innerHTML"
    ></div>

    <form
      hx-post="/admin/shares"
      hx-target="#result"
      hx-swap="innerHTML"
      hx-on::after-request="if(!event.detail.successful){document.getElementById('result').textContent=event.detail.xhr.responseText} else {htmx.trigger('#shares', 'refresh')}"
    >
      <label for="feed-search">Feed</label>
      <div class="combo" data-combo="feed">
        <input
          type="text"
          id="feed-search"
          autocomplete="off"
          placeholder="Search feed..."
        />
        <div class="combo-list" id="feed-list" hidden></div>
      </div>
      <select id="feed" name="feed" hidden></select>

      <label for="channel-search">Channel</label>
      <div class="combo" data-combo="channel">
        <input
          type="text"
          id="channel-search"
          name="channel_name"
          autocomplete="off"
          placeholder="Select a feed first..."
        />
        <div class="combo-list" id="channel-list" hidden></div>
      </div>
      <input type="hidden" id="channel" name="channel_url" />

      <label for="ttl">TTL</label>
      <input id="ttl" name="ttl" value="4h" placeholder="e.g. 4h, 90m" />

      <button type="submit">
        <span class="spinner htmx-indicator"></span>
        Create share link
      </button>
    </form>
    <div id="result"></div>

    <h2>Active shares</h2>
    <table>
      <thead>
        <tr>
          <th>channel</th>
          <th>feed</th>
          <th>kind</th>
          <th>expires</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody
        id="shares"
        hx-get="/admin/shares"
        hx-trigger="load, refresh"
        hx-swap="innerHTML"
      ></tbody>
    </table>

    <script src="/admin/static/admin.js"></script>
  </body>
</html>
