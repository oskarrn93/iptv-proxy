name: Publish

on:
  release:
    types: [published]
  # For re-publishing, or a release created without the App token (those don't
  # trigger the event above). Run it against the tag: --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            name="iptv-proxy_${GITHUB_REF_NAME}_${target%/*}_${target#*/}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags="-s -w" -o "dist/$name/iptv-proxy" ./cmd/iptv-proxy
            cp config.yaml.example "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber

  image:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Add image to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # The markers let a workflow_dispatch re-publish replace the section
        # instead of appending a second one.
        run: |
          notes="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body | sed '/^<!-- image -->$/,/^<!-- \/image -->$/d')"
          gh release edit "$GITHUB_REF_NAME" --notes "$notes

          <!-- image -->
          ## Docker image

          [\`$IMAGE\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pkgs/container/${GITHUB_REPOSITORY#*/})

          \`\`\`sh
          docker pull $IMAGE:$VERSION@$DIGEST
          \`\`\`
          <!-- /image -->"
